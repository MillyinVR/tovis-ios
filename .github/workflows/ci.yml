name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The wire-contract gate. Validates every fixture in
  # TovisKit/Tests/TovisKitTests/Fixtures against tovis-app's generated API
  # schema, so a backend DTO change fails HERE instead of silently breaking
  # decode at runtime. Runs on Linux — it is just node+ajv — so it stays on the
  # 1x billing multiplier.
  contract:
    name: Wire contract (fixtures vs backend schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The schema is GENERATED in tovis-app, where `check:api-schema` already
      # guarantees the committed copy matches lib/dto/index.ts. We read it live
      # from that repo rather than vendoring a snapshot here: a vendored copy
      # would drift the moment a DTO changed, and this job would stay GREEN
      # while the wire contract rotted — the exact failure the gate exists to
      # catch. Auth is a read-only deploy key (secret TOVIS_APP_DEPLOY_KEY);
      # both repos are private, so some credential is unavoidable.
      - name: Fetch backend API schema (read-only deploy key)
        uses: actions/checkout@v7
        with:
          repository: MillyinVR/tovis-app
          ssh-key: ${{ secrets.TOVIS_APP_DEPLOY_KEY }}
          path: .tovis-app
          sparse-checkout: schema/api
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/contract/package-lock.json

      - name: Install ajv
        working-directory: scripts/contract
        run: npm ci

      - name: Validate fixtures against the backend schema
        working-directory: scripts/contract
        env:
          TOVIS_API_SCHEMA: ${{ github.workspace }}/.tovis-app/schema/api/tovis-api.schema.json
        run: npm run validate

  ios:
    name: TovisKit tests
    # macOS bills at 10x on private repos. This job used to also run
    # `xcodebuild test`, which was ~9 of its ~11 minutes — about 110 billable
    # minutes per run, and several runs in one day were enough to exhaust the
    # account's Actions allowance and refuse EVERY workflow across both repos.
    # `swift test` needs no simulator and no network (TovisKit has no external
    # SPM dependencies), so it keeps the signal that matters here — including
    # decode of the same fixtures the contract job validates — at ~a fifth of
    # the cost. See the app-target compile gap noted in BACKLOG.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      # TovisKit has no external SPM dependencies, so this needs no network and
      # no simulator — it is the cheapest real signal in the repo. It also
      # decodes the same Fixtures/*.json the contract job validates, so the two
      # jobs check the fixtures from both sides: shape (ajv) and decode (Swift).
      - name: TovisKit — swift test
        working-directory: TovisKit
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/swift-test.log"
          swift test 2>&1 | tee "$log"
          # A misconfigured or undiscovered test target reports SUCCESS having
          # run nothing. Assert the run was non-empty so a silently-empty gate
          # cannot pass as green.
          count=$(grep -oE 'Test run with [0-9]+ test' "$log" \
            | grep -oE '[0-9]+' | tail -1)
          if [ -z "$count" ] || [ "$count" -lt 1 ]; then
            echo "::error::TovisKit reported success but ran no tests"
            exit 1
          fi
          echo "TovisKit tests executed: $count" >> "$GITHUB_STEP_SUMMARY"

  # Everything under TovisTests/ — 33 files, 278 tests across 43 suites,
  # including NotificationDeepLinkTests, which pins where a tapped push row
  # navigates. NONE of it runs in the jobs above: the `ios` job builds TovisKit
  # only. THIS job is the only thing in CI that compiles `Tovis/` at all —
  # without it a Swift error in the app target ships green.
  #
  # ARMED on every PR and every push to main as of 2026-08-12 (TOV-REL-001).
  #
  # It was `workflow_dispatch`-only because this is the job that exhausted the
  # Actions allowance on 2026-07-19 and refused every workflow across BOTH repos
  # for hours — macOS bills at 10x on PRIVATE repos. That reason is now dead:
  # `gh repo view` reports BOTH MillyinVR/tovis-ios and MillyinVR/tovis-app as
  # PUBLIC (checked 2026-08-12), and GitHub's standard runners — macos-latest
  # included — are free for public repositories. There is no allowance left to
  # exhaust; the only remaining ceiling is the concurrent-job limit, which the
  # `concurrency:` block above already keeps to one run per ref.
  #
  # Arming it is not cosmetic. While this job was dispatch-only, `Tovis/` was
  # not COMPILED by any PR, which is how the missing App Attest entitlement
  # (tovis-app REV-041) reached a signed TestFlight build and 400'd every native
  # signup with CI fully green.
  #
  # Measured 2026-08-11 on an Apple Silicon Mac, clean DerivedData:
  #   build-for-testing     87s   <- dominates
  #   test-without-building  27s
  # A GitHub macOS runner is roughly 2.5-3.5x slower and must also resolve the
  # app target's remote SPM dependencies (Stripe, GoogleSignIn, AppAuth,
  # AppCheck, GoogleUtilities), so budget ~5-7 min wall.
  #
  # Note what the split says: the build dominates and the tests ride along for
  # ~24% more. So a "cheaper" compile-only job is a false economy — once you pay
  # for the build, run the tests.
  #
  # ⚠️ If either repo is ever made private again, this job starts billing at 10x
  # and must be re-gated (`if: github.event_name != 'pull_request'`, or a paths
  # filter for Tovis/**, TovisTests/**, tovis-ios.xcodeproj/**).
  app:
    name: App target (Tovis + TovisTests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      # Picked dynamically: hardcoding a device name breaks whenever GitHub
      # rolls the Xcode image.
      - name: Pick a simulator
        id: sim
        run: |
          set -o pipefail
          json=$(xcrun simctl list devices available -j)
          udid=$(echo "$json" | jq -r '[.devices | to_entries[] | select(.key|test("iOS")) | .value[] | select(.isAvailable and (.name|startswith("iPhone")))] | last | .udid')
          name=$(echo "$json" | jq -r '[.devices | to_entries[] | select(.key|test("iOS")) | .value[] | select(.isAvailable and (.name|startswith("iPhone")))] | last | .name')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::No available iPhone simulator on this runner"
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Simulator: $name ($udid)" >> "$GITHUB_STEP_SUMMARY"

      - name: App target — xcodebuild test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/xcodebuild-test.log"
          xcodebuild test \
            -project tovis-ios.xcodeproj \
            -scheme Tovis \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee "$log"
          # TovisTests uses Swift Testing, not XCTest, so xcodebuild's legacy
          # summary ALWAYS prints "Executed 0 tests" even on a good run — on exit
          # code alone an empty run is indistinguishable from success. Assert the
          # Swift Testing count instead, same as the TovisKit job above.
          count=$(grep -oE 'Test run with [0-9]+ test' "$log" \
            | grep -oE '[0-9]+' | tail -1)
          if [ -z "$count" ] || [ "$count" -lt 1 ]; then
            echo "::error::App target reported success but ran no tests"
            exit 1
          fi
          echo "App-target tests executed: $count" >> "$GITHUB_STEP_SUMMARY"
